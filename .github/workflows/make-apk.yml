name: Make Apk CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  Publish-Release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare release assets
      run: |
        ver="${GITHUB_REF_NAME#v}"
        echo "VERSION=${ver}" >> "$GITHUB_ENV"
        cp releases/TypoDev-release.apk "TypoDev-${ver}-release.apk"
        sha256sum "TypoDev-${ver}-release.apk" > SHA256SUMS.txt

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "TypoDev ${{ env.VERSION }}"
        files: |
          TypoDev-${{ env.VERSION }}-release.apk
          SHA256SUMS.txt
        body: |
          TypoDev ${{ env.VERSION }} is an Android keyboard with Bengali/Banglish typing, AI Assistant writing tools, Focus Mode, and customizable themes.

          ### What's New in ${{ env.VERSION }}
          - **Redesigned AI Assistant**: High-contrast vector icons in Dark & Light modes, 3-column AI Tools grid (including Math Solver & Vision AI), top-bar result actions (Replace, Insert, Copy, Regenerate), and expandable/collapsible Clipboard preview bar.
          - **Focus Mode**: Toggleable clean keyboard mode in All Tools that hides extra symbols from main keys while keeping Bengali sub-characters intact.
          - **Voice Typing & Suggestions**: Improved voice typing stability, punctuation handling, and cleaned suggestion bar dictionary entries.
          - **Math Extra Keys Restoration**: Restored Math symbols in Add to Key settings.
          - **IME Window Stability Fix**: Fixed keyboard occasionally not opening after screen/window changes or AI Settings dialog state transitions.

          ### Download and install
          Download **TypoDev-${{ env.VERSION }}-release.apk** below and install it. Android 5.0 or newer is supported (arm64-v8a, armeabi-v7a, x86, x86_64).

  Build-Apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Restore debug keystore from GitHub Secrets
      run: |
        if [[ ! "${{ secrets.DEBUG_KEYSTORE }}" = "" ]]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" > "debug.keystore.asc"
            if [[ -s "debug.keystore.asc" ]]; then
                echo "Restoring debug keystore from GitHub secrets"
                gpg -d --passphrase "debug0" --batch "debug.keystore.asc" > "debug.keystore"
            fi
        fi

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.3

    - name: Run tests
      run: gradle test

    - name: Build Debug and Release APKs
      run: |
        gradle assembleDebug assembleRelease assembleOptimizedDebug
        artifact="${{github.repository_owner}} ${{github.ref_name}}"
        artifact="${artifact//\//-}"
        echo "artifact=${artifact}" >> $GITHUB_ENV
      env:
        DEBUG_KEYSTORE: "debug.keystore"
        DEBUG_KEYSTORE_PASSWORD: debug0
        DEBUG_KEY_ALIAS: debug
        DEBUG_KEY_PASSWORD: debug0

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: "${{env.artifact}} debug_apk"
        path: build/outputs/apk/debug/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: "${{env.artifact}} release_apk"
        path: build/outputs/apk/release/*.apk

    - name: Check generated files
      run:
        git diff --name-only --exit-code
