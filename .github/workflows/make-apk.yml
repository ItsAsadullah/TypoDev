name: Make Apk CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  Publish-Release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Prepare release assets
      run: |
        ver="${GITHUB_REF_NAME#v}"
        echo "VERSION=${ver}" >> "$GITHUB_ENV"
        cp releases/TypoDev-release.apk "TypoDev-${ver}-release.apk"
        sha256sum "TypoDev-${ver}-release.apk" > SHA256SUMS.txt

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "TypoDev ${{ env.VERSION }}"
        files: |
          TypoDev-${{ env.VERSION }}-release.apk
          SHA256SUMS.txt
        body: |
          TypoDev ${{ env.VERSION }} is a fast, privacy-focused Android keyboard with Bengali/Avro/Jatiyo typing, AI Assistant & Math Solver, Clipboard & Snippets, Voice Typing, and customizable themes.

          ### What's New in ${{ env.VERSION }}
          - **Comprehensive Typing & Avro Fixes**: Eliminated composing word duplication across all in-keyboard bars (AI Prompt, Emoji Search, Clipboard Search/Add, Translate), added `kO` -> `কো` & `ৎ` phonetic protections, ZWNJ/ZWJ Bangla conjunct handling, surrogate-pair safe emoji deletion, and accurate `CAP_MODE_WORDS` / `CAP_MODE_CHARACTERS` autocapitalisation.
          - **Smarter AI Assistant, Math Solver & Vision**: Fixed offline Bangla math regex (`(ক+খ)²`), preserved multi-line list formatting when stripping emojis, skipped Gemini 2.5 reasoning thought blocks, improved standalone Ask AI prompts, added vision fallback routing, and enforced password-field privacy guards.
          - **Suggestions, Autocorrect & Inline Algebra**: Protected valid short English words (`id`, `shell`, `lets`) & prefix completions on spacebar, fixed ordinals (`11th`/`12th`/`13th`), fixed trinomial/binomial inline algebra expansion, and added unlearned word rejection tracking.
          - **In-App GitHub Auto-Update Checker**: Automatic update check (every 12h in Launcher/Settings) plus manual **Check for Updates** in Settings -> About.
          - **Performance, Direct Boot & R8 Optimization**: Enabled GPU hardware acceleration, unified Direct Boot safety across all stores, removed 2,600+ lines of dead legacy code, and hardened Manifest & ProGuard/R8 rules.

          ### Download and install
          Download **TypoDev-${{ env.VERSION }}-release.apk** below and install it. Android 5.0 or newer is supported (arm64-v8a, armeabi-v7a, x86, x86_64).

  Build-Apk:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Restore debug keystore from GitHub Secrets
      run: |
        if [[ ! "${{ secrets.DEBUG_KEYSTORE }}" = "" ]]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" > "debug.keystore.asc"
            if [[ -s "debug.keystore.asc" ]]; then
                echo "Restoring debug keystore from GitHub secrets"
                gpg -d --passphrase "debug0" --batch "debug.keystore.asc" > "debug.keystore"
            fi
        fi

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14.3

    - name: Run tests
      run: gradle test

    - name: Build Debug and Release APKs
      run: |
        gradle assembleDebug assembleRelease assembleOptimizedDebug
        artifact="${{github.repository_owner}} ${{github.ref_name}}"
        artifact="${artifact//\//-}"
        echo "artifact=${artifact}" >> $GITHUB_ENV
      env:
        DEBUG_KEYSTORE: "debug.keystore"
        DEBUG_KEYSTORE_PASSWORD: debug0
        DEBUG_KEY_ALIAS: debug
        DEBUG_KEY_PASSWORD: debug0

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: "${{env.artifact}} debug_apk"
        path: build/outputs/apk/debug/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: "${{env.artifact}} release_apk"
        path: build/outputs/apk/release/*.apk

    - name: Check generated files
      run:
        git diff --name-only --exit-code
